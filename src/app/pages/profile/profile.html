<mat-card>

  <mat-card-header>
    <mat-card-title>Profiel</mat-card-title>
  </mat-card-header>

  <mat-card-content>

    <form [formGroup]="profileForm">

      <mat-form-field appearance="outline">
        <mat-label>Naam</mat-label>
        <input
          matInput
          formControlName="name">
      </mat-form-field>

    </form>

  </mat-card-content>

  <mat-card-actions>

    <button
      mat-button
      routerLink="/">
      Terug
    </button>

    <button
      mat-raised-button
      color="primary"
      (click)="save()">

      Opslaan

    </button>

  </mat-card-actions>

</mat-card>
