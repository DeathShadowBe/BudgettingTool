<div class="dashboard-layout">

  <mat-toolbar color="primary">
  <div class="welcome">
    Welkom {{ user?.firstName }}
  </div>

  <mat-divider></mat-divider>

  <button
    mat-icon-button
    [matMenuTriggerFor]="dashboardMenu"
    class="logout-button">

    <div class="avatar">
      {{ avatarLetter }}
    </div>

  </button>

  </mat-toolbar>

  </header>

  <div class="dashboard-content">

    <router-outlet></router-outlet>

  </div>

</div>

<mat-menu #dashboardMenu="matMenu">

    <button
      mat-menu-item
      (click)="openTransactions()">

      <mat-icon>home</mat-icon>

      <span>Home</span>

    </button>

    <button
      mat-menu-item
      (click)="openProfile()">

      <mat-icon>person</mat-icon>

      <span>Profiel</span>

    </button>

    <button
      mat-menu-item
      (click)="logout()">

      <mat-icon>logout</mat-icon>

      <span>Uitloggen</span>

    </button>

  </mat-menu>
